[package]
name = "mymac-core"
version = "0.1.0"
description = "MyMac 业务内核（不依赖 UI 框架）"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
trash = "5.2.6"
plist = "1.10.0"
fontdue = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
arboard = "3"
chrono = "0.4"
scru128 = "3"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.6"
url = "2.5"
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSError", "NSObject", "NSURL", "NSDictionary"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequestHandler", "VNRequest", "VNObservation", "VNTypes", "VNGeometry", "objc2-core-foundation"] }
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
