[package]
name = "egui-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# M0 技术验证：eframe(egui) + 托盘 + 全局快捷键 + Dock 显隐 + 中文渲染 + 透明覆盖层
# 不改动 src-tauri 现有工程；此 crate 独立构建，验证通过后作为 M1 拆分起点。

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu", # 渲染后端走 Metal（wgpu）
] }
# 注：eframe 0.37（2026-10-15）已把 App::update 改名为 App::ui，
# 而 egui-phosphor 0.14 仍基于 egui 0.36 —— 锁定 0.36.2 以匹配图标库生态。
# 待 egui-phosphor 跟进 0.37 后再评估升级。
egui-phosphor = { version = "=0.14.0", features = ["subset"] } # 图标，风格接近 lucide
tray-icon = "0.26"    # 托盘
muda = "0.21"         # 托盘菜单（Tauri 内部同款）
global-hotkey = "0.8" # 全局快捷键 F1
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
] }

[profile.release]
strip = true
lto = "thin"
