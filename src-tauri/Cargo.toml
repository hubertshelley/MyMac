[package]
name = "mymac"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mymac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
trash = "5.2.6"
plist = "1.10.0"
fontdue = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
arboard = "3"
chrono = "0.4"
scru128 = "3"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.6"
url = "2.5"
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

